name = "mosquito-risk-reports"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Free-tier friendly: D1 + Workers both have generous free quotas, so this
# API costs $0/month at MVP traffic levels.
[[d1_databases]]
binding = "DB"
database_name = "myggprognos-reports"
# Points at the dedicated myggprognos Cloudflare account's D1 database
# (migrated from the personal account's ab6e5475-646e-402e-ab63-b02e6af48e6c,
# same name, different account -- the old database is untouched and kept as
# rollback protection until this account is fully verified in production).
database_id = "7e6f9aaf-8e47-4435-b468-9f879933d76e"

[vars]
# Comma-separated list of origins allowed to call this API. https://myggprognos.se
# is the canonical production domain (custom domain on Netlify, confirmed live
# 2026-08-25; https://www.myggprognos.se redirects to it). https://myggprognos.netlify.app
# is the underlying Netlify subdomain, kept as a fallback/testing origin now that
# the custom domain is live. https://zesty-pony-0b7626.netlify.app is an earlier
# auto-generated Netlify subdomain seen during migration testing, kept here too
# until it's confirmed unused (safe either way, this only widens who's allowed to
# call the API). The GitHub Pages origin is kept as a legacy fallback (see
# deploy-pages.yml) and localhost covers dev/preview ports. NOTE: this is
# a live [vars] value read by cors.ts at request time -- pushing this
# change requires a `wrangler deploy` (or `npm run deploy` in worker/) to
# take effect, since Cloudflare Workers vars aren't redeployed by the
# GitHub/Netlify pipelines.
ALLOWED_ORIGINS = "https://myggprognos.se,https://myggprognos.netlify.app,https://zesty-pony-0b7626.netlify.app,https://myggprognos.github.io,http://localhost:5173,http://localhost:4173"
# Non-secret salt for hashing submitter IPs for rate-limiting only; for
# production prefer `wrangler secret put REPORT_HASH_SALT` instead of
# committing a real salt here.