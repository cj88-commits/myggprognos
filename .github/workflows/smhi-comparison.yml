name: SMHI Provider Comparison (parallel evaluation)

# Manual-only (workflow_dispatch), not on a schedule -- this runs the
# forecast pipeline against SMHI Open Data instead of Open-Meteo (see
# forecast/src/smhi_weather.py and the README's "SMHI parallel evaluation"
# section) purely to compare output quality against the production
# Open-Meteo-driven pipeline. It writes to data/generated/latest_smhi and
# a separate history cache -- never data/generated/latest, never the
# production weather_history_cache.json.gz -- and does not trigger a Pages
# deployment. The live site is unaffected by this workflow no matter what
# it does. Add a cron schedule here only once the comparison has been
# reviewed and the migration is actually approved to proceed.
on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Use the small sample grid + synthetic weather instead of the full Sweden grid + SMHI"
        type: boolean
        default: false

concurrency:
  group: smhi-comparison
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-smhi-comparison:
    runs-on: ubuntu-latest
    # SMHI's MultiPoint requests are one call per (time, parameter) pair
    # covering the ENTIRE grid at once, independent of how many of our own
    # cells we need -- unlike Open-Meteo's per-cell-batch design, so a
    # full-Sweden fetch costs roughly the same request count as a 6-cell
    # one (confirmed live: ~440 requests, a few minutes). This timeout is
    # generous headroom over that, not the 360min Open-Meteo needs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: forecast/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: forecast

      # Same cache as forecast.yml (same key -- both workflows need the
      # identical grid/static-features, generated once and shared) plus
      # the SMHI grid index built from that same grid.
      - name: Cache static grid + features
        id: static-cache
        uses: actions/cache@v4
        with:
          path: |
            data/static/grid.json
            data/static/cell_features.json
          key: static-grid-v2-${{ hashFiles('forecast/src/config.py', 'forecast/src/grid.py', 'forecast/src/static_features.py', 'scripts/prepare_grid.py', 'scripts/prepare_static_features.py', 'data/static/sweden_boundary.geojson') }}

      - name: Prepare grid (cache miss only)
        if: steps.static-cache.outputs.cache-hit != 'true'
        run: python scripts/prepare_grid.py

      - name: Prepare static features (cache miss only)
        if: steps.static-cache.outputs.cache-hit != 'true'
        run: python scripts/prepare_static_features.py

      - name: Cache SMHI grid index
        id: smhi-index-cache
        uses: actions/cache@v4
        with:
          path: data/static/smhi_grid_index.json
          key: smhi-grid-index-v1-${{ hashFiles('data/static/grid.json') }}

      - name: Prepare SMHI grid index (cache miss only)
        if: steps.smhi-index-cache.outputs.cache-hit != 'true'
        run: python scripts/prepare_smhi_grid_index.py

      - name: Run forecast pipeline (SMHI provider)
        run: |
          if [ "${{ inputs.sample }}" = "true" ]; then
            python scripts/run_forecast.py --sample --provider smhi --verbose
          else
            python scripts/run_forecast.py --provider smhi --verbose
          fi

      - name: Check for changes
        id: changes
        run: |
          git add data/generated/latest_smhi data/generated/weather_history_cache_smhi.json.gz data/static/smhi_grid_index.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push SMHI comparison output
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "mosquito-risk-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update SMHI comparison forecast $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Upload SMHI comparison artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smhi-comparison-${{ github.run_id }}
          path: data/generated/latest_smhi
          retention-days: 30
