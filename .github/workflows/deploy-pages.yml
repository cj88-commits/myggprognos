# STAGING TARGET FOR THE GITHUB PAGES MIGRATION (see README "Forecast data
# hosting" / production readiness report). Netlify remains the live
# production site (myggprognos.se) until the Pages deployment below is
# fully verified and the domain cutover is explicitly approved -- this
# workflow only builds and publishes to the *temporary* Pages URL in the
# meantime, so it's safe to iterate on without affecting production.
#
# Deliberately triggers ONLY on frontend/** changes -- NOT on
# data/generated/** (that used to also be a trigger, back when this
# workflow bundled the generated forecast data into the build; now that
# the frontend fetches forecast data live from Cloudflare R2 at runtime
# (VITE_FORECAST_DATA_BASE), a forecast update must never cause a Pages
# deployment, so forecast.yml's every-6-hours commits no longer touch this
# workflow at all.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          # Repo Variable (Settings > Secrets and variables > Actions >
          # Variables -- NOT Secrets, this is just a public URL), set once
          # the Cloudflare R2 forecast-data bucket exists (see production
          # readiness report). Empty/unset falls back to the relative
          # "data/latest" path bundled below, same as before this migration.
          VITE_FORECAST_DATA_BASE: ${{ vars.FORECAST_DATA_BASE_URL }}

      # FALLBACK ONLY, for as long as VITE_FORECAST_DATA_BASE above is
      # unset: `npm run build` already copies frontend/public/data/latest
      # (the small committed sample dataset) into dist/data/latest; if a
      # real full-grid forecast has been generated, overwrite it with that
      # so a fallback Pages deployment never ships only sample data. Once
      # FORECAST_DATA_BASE_URL is set, the frontend fetches live from R2
      # instead and never requests this bundled copy at all -- kept here
      # only so Pages still works if R2 is ever unreachable at build time.
      - name: Bundle forecast data with the site
        run: |
          if [ -f "data/generated/latest/manifest.json" ]; then
            rm -rf frontend/dist/data/latest
            cp -r data/generated/latest frontend/dist/data/latest
          else
            echo "No generated forecast found; keeping bundled sample data."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
