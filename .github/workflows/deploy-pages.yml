name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/generated/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      # `npm run build` already copies frontend/public/data/latest (the
      # small committed sample dataset) into dist/data/latest. If a real
      # full-grid forecast has been generated, overwrite it with that --
      # so Pages deployment never fails solely due to missing forecast
      # data, and always ships the freshest available data.
      - name: Bundle forecast data with the site
        run: |
          if [ -f "data/generated/latest/manifest.json" ]; then
            rm -rf frontend/dist/data/latest
            cp -r data/generated/latest frontend/dist/data/latest
          else
            echo "No generated forecast found; keeping bundled sample data."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
