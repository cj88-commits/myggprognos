name: Forecast Pipeline

on:
  schedule:
    # Every 6 hours, matching FORECAST_UPDATE_INTERVAL_HOURS in forecast/src/config.py.
    # GitHub stopped firing this trigger entirely after 2026-08-25 (no runs of
    # any kind -- not even queued/failed -- for the next four 6-hourly
    # windows); re-committing this file is the documented workaround for a
    # cron schedule GitHub has silently dropped.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "Use the small sample grid + synthetic weather instead of the full Sweden grid + Open-Meteo"
        type: boolean
        default: false
      min_cell_count_ratio:
        description: "Override the 0.9 cell-count-drop safety floor for this run only (e.g. '0.85') -- leave blank for routine runs; only set this after verifying by hand that a grid/boundary change deliberately shrank the cell count"
        type: string
        default: ""

# Never run two forecast generations at once (a scheduled run and a manual
# dispatch could otherwise race and interleave writes); queue rather than
# cancel so a manually triggered run still completes.
concurrency:
  group: forecast-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-forecast:
    runs-on: ubuntu-latest
    # NOTE: 360 minutes (6 hours) is a hard ceiling for GitHub-hosted
    # runners that timeout-minutes cannot raise (tried 480 here first --
    # the job was still killed at exactly 6h, confirming this). This
    # historically mattered a lot for Open-Meteo, whose per-cell-batch
    # request design scales with grid size and hit severe rate limiting
    # at full-Sweden scale (see weather.py / history_cache.py). SMHI (the
    # default provider as of this migration -- see README) has no such
    # scaling problem and typically finishes the whole grid in ~15-20
    # minutes; this generous ceiling is kept mainly as a safety margin and
    # for the retained open-meteo fallback path (--provider open-meteo),
    # not because SMHI runs are expected to need it.
    timeout-minutes: 360
    # Explicit three-way migration switch (repo Variable, see README
    # "Forecast data hosting"). Defaults to "git" (today's behaviour,
    # unaffected) when unset, so adding R2 secrets alone changes nothing
    # until this variable is deliberately set:
    #   git        - forecast data + weather-history cache committed/pushed
    #                to `main` exactly as before. No R2 steps run.
    #   r2-test    - BOTH paths run: R2 publish/checkpoint AND the legacy
    #                git commit/push, so R2 can be proven reliable while
    #                git stays the actual production-serving path (nothing
    #                downstream -- Netlify, Pages' fallback bundling --
    #                depends on R2 yet). Use this to validate R2 end-to-end.
    #   r2-cutover - R2 only. No forecast-data git commit, no weather-
    #                history checkpoint commit, and forecast.yml no longer
    #                dispatches deploy-pages.yml. A rare data/static-only
    #                change (grid/boundary regeneration) still commits/
    #                pushes on its own -- that's unrelated config, not
    #                per-run forecast delivery data -- so an occasional
    #                Netlify deploy from THAT is expected even in this
    #                mode, just not from routine 6-hourly forecast runs.
    env:
      FORECAST_STORAGE_MODE: ${{ vars.FORECAST_STORAGE_MODE || 'git' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: forecast/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: forecast

      # Grid geometry is deterministic and expensive to recompute; cache it
      # so the scheduled run only regenerates when the resolution/config
      # actually changes (see forecast/src/config.py). cell_features.json
      # is NOT cached here -- it's git-committed (see README "How to
      # refresh static GIS features"), computed from several GB of ESA
      # WorldCover + Copernicus DEM tiles that aren't available in CI, so
      # there's nothing for this job to regenerate it *from*; the step
      # below only ever produces a placeholder fallback, which must not
      # silently overwrite the committed real data.
      - name: Cache grid
        id: static-cache
        uses: actions/cache@v4
        with:
          path: data/static/grid.json
          # v1 only hashed config.py, so a boundary-only change (e.g.
          # replacing data/static/sweden_boundary.geojson with a
          # higher-resolution one) silently kept serving the stale cached
          # grid -- bumped to v2 and widened to cover every input that
          # actually affects grid generation.
          key: static-grid-v2-${{ hashFiles('forecast/src/config.py', 'forecast/src/grid.py', 'scripts/prepare_grid.py', 'data/static/sweden_boundary.geojson') }}

      - name: Prepare grid (cache miss only)
        if: steps.static-cache.outputs.cache-hit != 'true'
        run: python scripts/prepare_grid.py

      # cell_geometry.json.gz (the frontend's painted land polygons, see
      # scripts/prepare_cell_geometry.py) is keyed by cell_id to this same
      # grid -- if grid.json changes (new/renumbered cells, e.g. from a
      # boundary or supplementary-island-cell algorithm change) without
      # this file being regenerated too, previously-painted cells silently
      # stop matching any forecast data (rendered as "no data" / near-
      # transparent) while newly added cells never get painted at all.
      # Confirmed live: exactly this happened 2026-08-10 to 2026-08-23
      # (grid.py rewritten, grid.json regenerated with a different cell
      # count, cell_geometry.json.gz never re-run to match) and produced
      # visible white gaps on real coastline/archipelago land. Regenerating
      # whenever the grid itself changed (same cache-miss signal as the
      # grid step above) keeps the two permanently in sync without
      # re-running this on every routine forecast update.
      - name: Prepare cell geometry (grid changed only)
        if: steps.static-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/prepare_cell_geometry.py
          cp data/static/cell_geometry.json.gz frontend/public/data/static/cell_geometry.json.gz

      - name: Prepare static features (only if missing)
        # cell_features.json is committed (real GIS-derived data) and
        # checked out by actions/checkout above -- this exists purely as a
        # safety net for the (should-be-impossible) case where it's
        # missing, e.g. a fresh grid.json cache-miss adds cells the
        # committed file doesn't cover yet. pipeline.py's own
        # missing-cell check (generate_placeholder_static_features per
        # cell) already handles a *partial* gap without needing this step
        # at all; this only fires if the file is absent outright.
        run: |
          if [ -f data/static/cell_features.json ]; then
            echo "cell_features.json already present (committed real data) -- not regenerating"
          else
            echo "cell_features.json missing -- generating placeholders as a fallback"
            python scripts/prepare_static_features.py
          fi

      # SMHI is the default weather provider (see README) -- its
      # nearest-neighbor grid index only needs rebuilding when our own
      # grid changes, same reasoning as the static-grid cache above.
      - name: Cache SMHI grid index
        id: smhi-index-cache
        uses: actions/cache@v4
        with:
          path: data/static/smhi_grid_index.json
          key: smhi-grid-index-v1-${{ hashFiles('data/static/grid.json') }}

      - name: Prepare SMHI grid index (cache miss only)
        if: steps.smhi-index-cache.outputs.cache-hit != 'true'
        run: python scripts/prepare_smhi_grid_index.py

      # MIGRATION (see README "Forecast data hosting"): moves the weather-
      # history cache off git-commit-based checkpointing and onto Cloudflare
      # R2, since GitHub Actions cache has no reliable overwrite semantics
      # for a value that must be updated every single run. Runs in
      # r2-test/r2-cutover mode only (see FORECAST_STORAGE_MODE above); a
      # missing R2 object is a normal cold-start (handled inside the
      # script), but missing/wrong CREDENTIALS while this mode is
      # deliberately selected fails the step loudly rather than silently
      # falling back -- the mode is an explicit choice, not a maybe. The
      # git-committed cache file (checked out above) still sits on disk
      # either way as of this run's checkout, so a first R2 run (empty
      # bucket) naturally starts from that rather than from nothing.
      - name: Restore weather-history cache from R2
        if: ${{ env.FORECAST_STORAGE_MODE != 'git' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
        run: python scripts/weather_cache_r2.py download --path data/generated/weather_history_cache.json.gz --verbose

      - name: Run forecast pipeline
        id: run
        # NOTE: do not set OPEN_METEO_BASE_URL here. This previously read
        # ${{ vars.OPEN_METEO_BASE_URL }}, an org/repo Actions variable that
        # was never configured -- GitHub renders that as an EMPTY STRING,
        # not "unset", and os.environ.get(key, default) in config.py only
        # falls back to the default when the key is truly absent from the
        # environment. So every forecast (non-archive) weather request in
        # every run used base_url="" and failed outright ("Request URL is
        # missing an 'http://' or 'https://' protocol"), for literally
        # every batch -- confirmed in a completed run's logs (371/371
        # forecast batches failed). The pipeline silently fell back to
        # history-only weather for almost every cell instead of erroring
        # loudly, which is very likely why computed risk read near-zero
        # almost everywhere in that run's output. OPEN_METEO_ARCHIVE_URL
        # has never had an env override here and has always worked
        # correctly via config.py's hardcoded default -- do the same here.
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
        run: |
          # The pipeline checkpoints its weather-history cache to local disk
          # every CACHE_CHECKPOINT_CHUNK_CELLS cells (see history_cache.py),
          # but that alone does not survive a hard job kill: the "Commit and
          # push" step below only runs AFTER this whole step finishes, so if
          # GitHub's 6h ceiling kills the runner mid-fetch, everything
          # checkpointed only to the ephemeral runner's disk is destroyed
          # with it (confirmed: a full 6h run left nothing pushed to
          # origin). Push the cache file periodically in the background so
          # progress survives even if this step never returns normally.
          (
            while true; do
              sleep 600
              if [ -f data/generated/weather_history_cache.json.gz ]; then
                # MIGRATION (see README "Forecast data hosting" / job-level
                # FORECAST_STORAGE_MODE comment above): r2-test/r2-cutover
                # also checkpoint to R2. Tolerant of failure (log + retry
                # next interval) same as the git push below -- this is a
                # best-effort mid-run safety net either way, not the
                # authoritative save (that's the "Save weather-history
                # cache to R2" step after this one finishes).
                if [ "$FORECAST_STORAGE_MODE" != "git" ]; then
                  python scripts/weather_cache_r2.py upload --path data/generated/weather_history_cache.json.gz \
                    || echo "R2 checkpoint upload failed, will retry next interval"
                fi

                # git/r2-test mode only -- r2-cutover makes ZERO commits to
                # main for weather-history state, by design (requirement:
                # checkpoint commits must stop once R2 mode is cut over).
                if [ "$FORECAST_STORAGE_MODE" != "r2-cutover" ]; then
                  git add data/generated/weather_history_cache.json.gz
                  if ! git diff --cached --quiet; then
                    git config user.name "mosquito-risk-bot"
                    git config user.email "actions@users.noreply.github.com"
                    git commit -m "Checkpoint weather history cache (run in progress)"
                    git fetch origin main
                    # --autostash: grid.json/cell_geometry.json.gz can be sitting
                    # uncommitted in the working tree for the whole run (see the
                    # "Prepare grid"/"Prepare cell geometry" steps above -- they're
                    # deliberately not committed until the final step, so a
                    # mismatched painted layer never gets deployed ahead of its
                    # matching forecast data). Plain `git rebase` refuses to start
                    # at all with ANY uncommitted tracked-file changes present,
                    # confirmed live ("cannot rebase: You have unstaged changes")
                    # -- autostash tucks them aside for the rebase and restores
                    # them after, whether it succeeds or is aborted below.
                    git rebase --autostash origin/main || git rebase --abort
                    git push origin HEAD:main || echo "checkpoint push failed, will retry next interval"
                  fi
                fi
              fi
            done
          ) &
          CHECKPOINT_PID=$!
          trap 'kill "$CHECKPOINT_PID" 2>/dev/null || true' EXIT

          RATIO_FLAG=""
          if [ -n "${{ inputs.min_cell_count_ratio }}" ]; then
            RATIO_FLAG="--min-cell-count-ratio ${{ inputs.min_cell_count_ratio }}"
          fi

          if [ "${{ inputs.sample }}" = "true" ]; then
            python scripts/run_forecast.py --sample --verbose
          else
            python scripts/run_forecast.py --verbose $RATIO_FLAG
          fi

      - name: Report generated data size
        if: always()
        run: |
          echo "data/generated/latest (delivery data, post-prune):"
          du -sh data/generated/latest 2>/dev/null || echo "  (missing)"
          echo "data/generated/weather_history_cache.json.gz (pipeline state):"
          du -sh data/generated/weather_history_cache.json.gz 2>/dev/null || echo "  (missing)"

      # MIGRATION (see README "Forecast data hosting"): final, authoritative
      # save of the weather-history cache to R2 after a successful run.
      # Runs in r2-test/r2-cutover mode (see FORECAST_STORAGE_MODE above);
      # in r2-test this happens alongside the still-active git commit
      # below, in r2-cutover this is the ONLY persistence for this file.
      - name: Save weather-history cache to R2
        if: ${{ env.FORECAST_STORAGE_MODE != 'git' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
        run: python scripts/weather_cache_r2.py upload --path data/generated/weather_history_cache.json.gz --verbose

      # MIGRATION (see README "Forecast data hosting"): publishes the
      # active-window forecast output to the public R2 delivery bucket so
      # the frontend can fetch it directly, independent of any Netlify/
      # Pages/git-commit deploy. Runs in r2-test/r2-cutover mode (see
      # FORECAST_STORAGE_MODE above) -- in r2-test alongside the still-
      # active git commit below, in r2-cutover this (not git) is the
      # authoritative publish. A failed upload here fails the whole job (no
      # `|| true`): a forecast generated locally but not published to R2
      # must never be reported as a successful run.
      - name: Publish forecast data to R2
        if: ${{ env.FORECAST_STORAGE_MODE != 'git' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_DATA_BUCKET: ${{ vars.R2_DATA_BUCKET }}
        run: python scripts/publish_forecast_data.py --verbose

      # Split static (grid/geometry -- rare, unrelated to per-run forecast
      # delivery, and frontend/public/data/static/cell_geometry.json.gz
      # MUST stay in git regardless of storage mode since Vite bundles it
      # directly into the frontend build) from generated (the actual
      # per-run forecast delivery data + weather-history cache -- the
      # thing r2-cutover mode must stop pushing to `main` entirely).
      # git status --porcelain rather than git add + git diff --cached, so
      # checking one doesn't affect what the other reports.
      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- data/static frontend/public/data/static/cell_geometry.json.gz)" ]; then
            echo "changed_static=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed_static=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$(git status --porcelain -- data/generated)" ]; then
            echo "changed_generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed_generated=false" >> "$GITHUB_OUTPUT"
          fi

      # git/r2-test mode: commits whatever changed (static and/or
      # generated), same combined behaviour as before this migration.
      # r2-cutover mode: NEVER stages data/generated -- even if it changed,
      # it is deliberately excluded, so this step only ever fires (and only
      # ever commits) for a data/static change in that mode. That is the
      # "zero forecast-data git pushes in r2-cutover mode" requirement.
      - name: Commit and push updated forecast
        if: ${{ steps.changes.outputs.changed_static == 'true' || (steps.changes.outputs.changed_generated == 'true' && env.FORECAST_STORAGE_MODE != 'r2-cutover') }}
        run: |
          git add data/static frontend/public/data/static/cell_geometry.json.gz
          if [ "$FORECAST_STORAGE_MODE" != "r2-cutover" ]; then
            git add data/generated
          fi
          git config user.name "mosquito-risk-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update forecast $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      # Retain a copy of every run's full output as a workflow artifact for
      # historical/evaluation purposes (see README "Historical forecast
      # archive"), separate from the always-latest copy committed above.
      - name: Upload forecast artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ github.run_id }}
          path: data/generated/latest
          retention-days: 90

      # git mode ONLY. In git mode, Pages' own build still bundles
      # data/generated/latest as a fallback (see deploy-pages.yml), so it
      # genuinely needs a fresh build to pick up new forecast data. In
      # r2-test/r2-cutover mode this must NOT fire -- the whole point being
      # validated is that Pages (once pointed at FORECAST_DATA_BASE_URL)
      # sees new forecast data purely by fetching it live from R2, with NO
      # redeploy at all. This is the exact mechanism that used to make "a
      # forecast run triggers Pages" true regardless of deploy-pages.yml's
      # own push-path filter -- workflow_dispatch (used here) bypasses path
      # filtering entirely, so gating it on mode (not just removing it) is
      # what actually stops it.
      - name: Trigger Pages deployment
        if: ${{ env.FORECAST_STORAGE_MODE == 'git' && (steps.changes.outputs.changed_static == 'true' || steps.changes.outputs.changed_generated == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref ${{ github.ref_name }}
