# Mosquito Risk model configuration
#
# This file is the single source of truth for tunable weights and thresholds
# used by the rule-based scoring model in forecast/src/model.py. Keep all
# "magic numbers" here rather than hard-coded in the pipeline so that model
# behaviour can be reviewed and adjusted without touching code.

model:
  version: "0.1.0"

  # Base temperature (Celsius) above which mosquito development accumulates.
  development_base_temperature_c: 10

  # Weights for the "population potential" component. Should sum to ~1.0;
  # they are applied to bell/sigmoid-transformed sub-scores (0-1 each).
  population_weights:
    temperature: 0.22
    rainfall: 0.22
    moisture: 0.14
    wetland: 0.13
    forest: 0.07
    season: 0.07
    snowmelt: 0.05
    # Decay-weighted recent rainfall x wetland/lake density x terrain
    # drainage -- how long rain-fed pools likely persist (see
    # feature_engineering.py::_standing_water_persistence).
    standing_water: 0.10

  # Parameters for the "biting activity" component (temperature, humidity,
  # wind, daylight/daypart, rain suppression).
  activity:
    optimum_temperature_c: 23
    temperature_width: 10
    wind_half_suppression_ms: 3.5
    wind_full_suppression_ms: 9.0
    minimum_humidity_percent: 35
    optimum_humidity_percent: 75
    rain_suppression_mm_per_hour: 1.0

  # Parameters for the "exposure" component -- human-ENCOUNTER conditions
  # (shelter/wind, urban vs open context, personal proximity to water), not
  # a second pass at habitat suitability. wetland_fraction and
  # water_body_density are deliberately NOT inputs here: both already drive
  # population_potential above, and reusing them here double-counted the
  # same raster value as if it were two independent signals (see
  # docs/model-audit-before.md #5 / docs/model-audit-after.md).
  exposure:
    water_proximity_half_distance_km: 1.5
    forest_shelter_weight: 0.20
    urban_exposure_weight: -0.20
    water_proximity_weight: 0.35
    base_exposure: 0.55

  # How population/activity/exposure combine into the final 0-100 risk.
  # Population is the biological gate (no mosquitoes -> no risk regardless
  # of weather); activity and exposure are MODIFIERS around a neutral
  # midpoint rather than raw 0-1 gates, so a single weak factor (e.g.
  # midday wind suppression) can no longer collapse an otherwise-real
  # population signal to near zero the way a plain three-way product did.
  # See docs/model-audit-before.md worked examples and
  # docs/model-audit-after.md for the calibration rationale behind these
  # specific numbers (chosen against real full-Sweden output, not asserted
  # blindly from the spec's suggested starting range).
  #
  #   activity_modifier = activity_floor + activity_weight * (biting_activity/100)
  #   exposure_modifier = exposure_floor + exposure_weight * (base_exposure_fraction) * activity_profile_multiplier
  #   risk = clamp(population_fraction * activity_modifier * exposure_modifier * scale, 0, 100)
  combination:
    activity_floor: 0.30
    activity_weight: 0.70
    exposure_floor: 0.75
    exposure_weight: 0.50
    scale: 105

# Category-band boundaries (4 edges -> 5 bands: very_low/low/moderate/high/
# very_high), published to the frontend via manifest.json so it never holds
# an independently-drifting copy (see docs/model-audit-before.md #5 and the
# `combination:` section above for the same pattern already used for the
# formula constants).
#
# "risk" (shared by Myggrisk idag / Myggrisk just nu -- both are the same
# 0-100 score, just evaluated at different times) reuses the existing,
# already-validated RISK_CATEGORIES bounds from config.py (0/20/40/60/80),
# unchanged by this iteration.
#
# "abundance" (Myggläge / population_potential) genuinely needed its own
# bounds: it is a weighted SUM of bounded terms, not the same multiplicative
# combination as risk, and empirically tops out far short of 100 -- checked
# against the real full-Sweden dataset (Aug 2026, 162,358 daily cell-records
# across all 7 forecast days): min 14.7, max 74.2, median 48.3, p99 66.9.
# Reusing the risk bounds (0/20/40/60/80) left "very_high" (80-100)
# permanently and completely empty (0.0% of cells, every day) -- exactly
# the "category thresholds create nearly empty bands" failure mode the
# diagnostics are meant to catch. These bounds were chosen by testing
# several candidates against that same real dataset and picking the one
# giving every band a meaningful, non-empty share:
#   very_low 9.3% / low 18.6% / moderate 21.2% / high 34.2% / very_high 16.6%
# Caveat: derived from one week of real August data, not a full season --
# see docs/model-audit-after.md for the same caveat applied to the
# combination constants above.
thresholds:
  abundance: [28, 38, 48, 58]

# Activity-adjusted exposure multipliers. These are illustrative,
# transparent multipliers, not independently validated biological models.
activities:
  general: 1.0
  running: 0.75
  hiking: 1.15
  camping: 1.35
  fishing: 1.4
  gardening: 1.05
  outdoor_dining: 1.1

# Weights used when combining confidence sub-scores (0-1 each) into the
# final confidence score (0-1).
confidence:
  horizon_weight: 0.30
  weather_completeness_weight: 0.20
  static_data_quality_weight: 0.15
  component_agreement_weight: 0.15
  report_support_weight: 0.10
  fallback_penalty_weight: 0.10

# Rules for blending user reports into the "report-adjusted" risk layer.
# Report weight increases with sample size but is always capped, and a
# single/lone report never changes the forecast.
report_adjustment:
  model_weight_default: 1.0
  tiers:
    - min_reports: 3
      max_reports: 5
      max_report_weight: 0.10
    - min_reports: 6
      max_reports: 15
      max_report_weight: 0.20
    - min_reports: 16
      max_reports: null
      max_report_weight: 0.30
  max_report_age_hours: 12
  relevance_radius_km: 15
